<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Finances · McKain Research Group</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💵</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --evergreen: #002400; --forest: #273b09; --teal: #007A62; --teal-soft: #d9f2ea;
  --bg: #f4f6f2; --card: #fff; --border: #dde3d8; --text: #12210f; --muted: #6b7569;
  --red: #b3261e; --red-soft: #f7dcd8; --amber: #a26b00; --amber-soft: #faf0d9; --blue: #1a5fa5; --blue-soft: #e0edfb;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
a { color: var(--teal); cursor: pointer; }
.header { background: var(--evergreen); color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #2fd0ad; margin-bottom: 3px; }
.header h1 { font-size: 20px; font-weight: 650; }
.who { font-size: 12.5px; color: #a9c2b2; display: flex; gap: 12px; align-items: center; }
.who button { background: none; border: 1px solid #ffffff44; color: #d7e7dc; }
nav.tabs { background: #fff; border-bottom: 1px solid var(--border); display: flex; gap: 4px; padding: 0 16px; overflow-x: auto; }
nav.tabs button { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 12px 12px 10px; font-size: 14px; color: var(--muted); font-weight: 550; white-space: nowrap; }
nav.tabs button.active { color: var(--teal); border-bottom-color: var(--teal); }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
.card h2 { font-size: 15px; color: var(--evergreen); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.card h2 .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border); background: #fff; color: var(--text); cursor: pointer; }
button:hover { border-color: var(--teal); }
button.primary { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 600; }
button.danger { color: var(--red); }
button.sm { padding: 4px 9px; font-size: 12px; }
input, select, textarea { font: inherit; font-size: 13.5px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: #fff; color: inherit; width: 100%; }
textarea { min-height: 60px; resize: vertical; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 10px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filters select, .filters input { width: auto; min-width: 130px; }
.filters input[type=search] { min-width: 220px; flex: 1; max-width: 320px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.tile .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.tile .v { font-size: 24px; font-weight: 650; color: var(--evergreen); margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.table-wrap { overflow: auto; max-height: 560px; border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #eef1eb; white-space: nowrap; }
th { position: sticky; top: 0; background: #f7f9f5; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); z-index: 1; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 180px; max-width: 340px; }
tr.click { cursor: pointer; } tr.click:hover td { background: #f6faf7; }
tr.total td { font-weight: 650; background: #f7f9f5; }
.neg { color: var(--red); } .pos { color: var(--teal); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #eceee9; color: #555; }
.pill.order { background: var(--blue-soft); color: var(--blue); }
.pill.committed { background: var(--amber-soft); color: var(--amber); }
.pill.import { background: #efe7f7; color: #5b3f86; }
.pill.income { background: var(--teal-soft); color: var(--teal); }
.pill.warn { background: var(--amber-soft); color: var(--amber); }
.pill.bad { background: var(--red-soft); color: var(--red); }
.acct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.acct { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; background: #fff; }
.acct h3 { font-size: 15px; color: var(--evergreen); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.acct .bal { font-size: 22px; font-weight: 650; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.acct dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; margin-top: 8px; }
.acct dt { color: var(--muted); } .acct dd { text-align: right; font-variant-numeric: tabular-nums; }
.meter { height: 8px; background: #eef1eb; border-radius: 6px; overflow: hidden; position: relative; margin-top: 4px; }
.meter > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--teal); border-radius: 6px; }
.meter > span.over { background: var(--red); }
.meter > i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--evergreen); }
.bars .b { display: grid; grid-template-columns: 170px 1fr 100px; gap: 10px; align-items: center; font-size: 13px; margin-bottom: 6px; }
.bars .b .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .b .v { text-align: right; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } .bars .b { grid-template-columns: 110px 1fr 84px; } }
.chart-box { position: relative; height: 280px; }
.empty { padding: 26px; text-align: center; color: var(--muted); font-size: 13.5px; }
.loading { padding: 60px; text-align: center; color: var(--muted); }
.modal-bg { position: fixed; inset: 0; background: #0006; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow: auto; }
.modal { background: #fff; border-radius: 12px; width: 100%; max-width: 620px; padding: 18px 20px; box-shadow: 0 10px 40px #0004; }
.modal.wide { max-width: 1100px; }
.modal h3 { font-size: 17px; color: var(--evergreen); margin-bottom: 12px; }
.modal .foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
.modal .foot .r { display: flex; gap: 8px; margin-left: auto; }
.err { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 1em; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--evergreen); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
.toast.show { opacity: 1; } .toast.err { background: var(--red); }
.auth-wrap { max-width: 420px; margin: 80px auto; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 26px; }
.auth-wrap h1 { font-size: 20px; color: var(--evergreen); margin: 4px 0 12px; }
.auth-wrap .eyebrow { color: var(--teal); }
.auth-wrap button { margin-top: 10px; width: 100%; }
.inline-in { width: 110px; text-align: right; padding: 4px 6px; }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading Lab Finances…</div></div>
<div class="toast" id="toast"></div>

<script>
// Lab Finances: where the lab's money comes from and goes. Admins only.
// Uses the Inventory Management (Lab Orders) Supabase project: its accounts and orders, plus the fin_ tables.
const SUPABASE_URL = 'https://ksqjvvojoscyfyrkzqvm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__o4tr1F2r1GjhMHjmUOsJw_Gcm7EqCA';
let sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const EXPENSE_CATS = ['Supplies', 'Personnel', 'Sequencing & services', 'Travel', 'Equipment', 'Indirect costs', 'Other'];
const INCOME_CATS = ['Award funds', 'Indirect cost return (ROH)', 'Transfer in', 'Refund', 'Other income'];
const CAT_COLORS = { 'Supplies': '#007A62', 'Personnel': '#1a5fa5', 'Sequencing & services': '#7b4fb0', 'Travel': '#c27a12',
  'Equipment': '#984321', 'Indirect costs': '#6b7569', 'Other': '#b8bfb3' };
const KINDS = { grant: 'Grant', startup: 'Startup', roh: 'ROH (indirect return)', operating: 'Operating', gift: 'Gift / endowment', other: 'Other' };
const OUTPUT_KINDS = { paper: 'Paper', dataset: 'Dataset', samples_sequenced: 'Samples sequenced', grant_awarded: 'Grant awarded', talk: 'Talk / poster', student: 'Student trained', other: 'Other' };
const FY_START_MONTH = 10;   // University of Alabama fiscal year: October 1 – September 30

let session = null, profile = null, tab = 'overview';
const D = { accounts: [], details: {}, txns: [], orders: [], budget: [], planned: [], outputs: [] };
const F = { fy: null, acct: '', cat: '', type: '', q: '' };   // transaction filters
let charts = [];
const app = document.getElementById('app');

// ── Small helpers ───────────────────────────────────────────
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n, cents) => (n < 0 ? '−' : '') + '$' + Math.abs(Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
const today = () => new Date().toISOString().slice(0, 10);
const fyOf = d => { const y = +d.slice(0, 4), m = +d.slice(5, 7); return m >= FY_START_MONTH ? y + 1 : y; };
const fyRange = fy => [`${fy - 1}-${String(FY_START_MONTH).padStart(2, '0')}-01`, `${fy}-${String(FY_START_MONTH - 1).padStart(2, '0')}-30`];
const fyLabel = fy => `FY${fy} (Oct ${fy - 1} – Sep ${fy})`;
const monthKey = d => d.slice(0, 7);
const addMonths = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setMonth(x.getMonth() + n); return x.toISOString().slice(0, 10); };
const monthsBetween = (a, b) => (new Date(b) - new Date(a)) / (1000 * 60 * 60 * 24 * 30.44);
const acctName = id => D.accounts.find(a => a.id === id)?.name || 'No account';
function toast(msg, err) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); setTimeout(() => t.className = 'toast', 2800); }
async function ok(q) { const r = await q; if (r.error) { toast('Could not save: ' + r.error.message, true); throw r.error; } return r; }

// ── Sign-in (same accounts as Lab Orders) ───────────────────
async function init() {
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_e, s) => { const before = session?.user?.id; session = s; if (before !== s?.user?.id) boot(); });
  boot();
}
async function boot() {
  if (!session) return renderAuth();
  const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  profile = data;
  if (!profile) { await sb.auth.signOut(); session = null; return renderAuth('That sign-in expired. Please request a new link.'); }
  if (profile.role !== 'admin') {
    app.innerHTML = `<div class="auth-wrap"><div class="eyebrow">McKain Research Group</div><h1>Lab Finances</h1>
      <p class="hint">This page is for lab admins only. You're signed in as ${esc(profile.email || profile.name)}.</p>
      <button onclick="signOut()">Sign out</button></div>`;
    return;
  }
  await loadAll();
  render();
}
function renderAuth(note) {
  app.innerHTML = `<div class="auth-wrap"><div class="eyebrow">McKain Research Group</div><h1>Lab Finances</h1>
    <label for="email-in">Email</label><input id="email-in" type="email" placeholder="you@ua.edu" autocomplete="email">
    <button class="primary" id="send-link">Email me a sign-in link</button>
    <p class="hint" id="auth-note" style="margin-top:10px">${esc(note || 'Uses your Lab Orders account. Admins only. If you are signed in to Lab Orders in this browser, you are already signed in here.')}</p></div>`;
  const go = async () => {
    const email = document.getElementById('email-in').value.trim(), n = document.getElementById('auth-note');
    if (!email) return;
    n.textContent = 'Sending…';
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: false } });
    n.textContent = error ? 'Could not send the link: ' + error.message : `Check ${email} for a sign-in link.`;
  };
  document.getElementById('send-link').onclick = go;
  document.getElementById('email-in').onkeydown = e => { if (e.key === 'Enter') go(); };
}
async function signOut() { await sb.auth.signOut(); session = null; profile = null; renderAuth(); }

// ── Data ────────────────────────────────────────────────────
async function loadAll() {
  const [a, d, t, o, b, p, out] = await Promise.all([
    sb.from('accounts').select('*').order('name'),
    sb.from('fin_account_details').select('*'),
    sb.from('fin_transactions').select('*').order('txn_date', { ascending: false }),
    sb.from('order_requests').select('id, item_name, vendor, category, account_id, quantity, estimated_cost, actual_cost, status, created_at, decided_at, received_on, requested_by_name'),
    sb.from('fin_budget_lines').select('*'),
    sb.from('fin_planned').select('*').order('due_date'),
    sb.from('fin_outputs').select('*').order('output_date', { ascending: false }),
  ]);
  const bad = [a, d, t, o, b, p, out].find(r => r.error);
  if (bad) toast('Some data could not load: ' + bad.error.message, true);
  D.accounts = a.data || []; D.txns = t.data || []; D.orders = o.data || [];
  D.details = Object.fromEntries((d.data || []).map(x => [x.account_id, x]));
  D.budget = b.data || []; D.planned = p.data || []; D.outputs = out.data || [];
  if (F.fy == null) F.fy = fyOf(today());
}

// Every money movement: typed or imported transactions, plus Lab Orders orders that no transaction pays for yet.
// An order that's been ordered but not received is "committed" (money promised, not yet confirmed spent).
function ledger() {
  const linked = new Set(D.txns.filter(t => t.order_request_id).map(t => t.order_request_id));
  const rows = D.txns.map(t => ({ kind: 'txn', id: t.id, date: t.txn_date, account_id: t.account_id, dir: t.direction, amount: Number(t.amount), category: t.category,
    payee: t.payee || '', desc: t.description || '', project: t.project || '', src: t.source, t }));
  D.orders.filter(o => ['ordered', 'received'].includes(o.status) && !linked.has(o.id)).forEach(o => {
    const amt = Number(o.actual_cost ?? o.estimated_cost ?? 0);
    if (!amt) return;
    rows.push({ kind: 'order', id: o.id, date: (o.received_on || o.decided_at || o.created_at || today()).slice(0, 10), account_id: o.account_id, dir: 'expense',
      amount: amt, category: /equipment/i.test(o.category || '') ? 'Equipment' : 'Supplies', payee: o.vendor || '', desc: o.item_name + (o.quantity > 1 ? ` ×${o.quantity}` : ''),
      project: '', src: o.status === 'ordered' ? 'committed' : 'order', estimate: o.actual_cost == null, o });
  });
  return rows.sort((x, y) => y.date.localeCompare(x.date));
}
const signed = r => r.dir === 'income' ? r.amount : -r.amount;

// Where an account stands: balance now, monthly burn, runway, projected balance at its end date
function acctStatus(acct, L) {
  const det = D.details[acct.id] || {};
  const from = det.opening_balance != null && det.opening_date ? det.opening_date : null;
  const base = det.opening_balance != null ? Number(det.opening_balance) : Number(det.total_award || 0);
  const mine = L.filter(r => r.account_id === acct.id && (!from || r.date > from));
  const spent = mine.filter(r => r.dir === 'expense').reduce((s, r) => s + r.amount, 0);
  const committed = mine.filter(r => r.src === 'committed').reduce((s, r) => s + r.amount, 0);
  const income = mine.filter(r => r.dir === 'income').reduce((s, r) => s + r.amount, 0);
  const balance = base + income - spent;
  const sixAgo = addMonths(today(), -6);
  const burn = mine.filter(r => r.dir === 'expense' && r.date >= sixAgo && r.date <= today()).reduce((s, r) => s + r.amount, 0) / 6;
  const horizon = det.end_date || addMonths(today(), 12);
  const plannedAhead = expandPlanned().filter(p => p.account_id === acct.id && p.due_date >= today() && p.due_date <= horizon).reduce((s, p) => s + p.amount, 0);
  const elapsed = det.start_date && det.end_date ? Math.min(1, Math.max(0, (new Date(today()) - new Date(det.start_date)) / (new Date(det.end_date) - new Date(det.start_date)))) : null;
  const usedOfAward = det.total_award ? (Number(det.total_award) - balance) / Number(det.total_award) : null;
  return { det, base, spent, committed, income, balance, burn, runway: burn > 0 ? balance / burn : null,
    plannedAhead, projected: balance - plannedAhead, horizon, elapsed, usedOfAward, monthsLeft: det.end_date ? monthsBetween(today(), det.end_date) : null };
}
// Planned costs with repeats spelled out into one entry per occurrence
function expandPlanned() {
  const out = [];
  D.planned.filter(p => !p.done).forEach(p => {
    if (!p.repeat_months) return out.push({ ...p, amount: Number(p.amount) });
    const until = p.repeat_until || addMonths(p.due_date, 12);
    for (let d = p.due_date, i = 0; d <= until && i < 120; d = addMonths(p.due_date, p.repeat_months * ++i)) out.push({ ...p, due_date: d, amount: Number(p.amount) });
  });
  return out;
}

// ── Shell ───────────────────────────────────────────────────
const TABS = [['overview', 'Overview'], ['money', 'Transactions'], ['plan', 'Budget & plan'], ['roi', 'Return on investment'], ['accounts', 'Accounts']];
function render() {
  charts.forEach(c => c.destroy()); charts = [];
  app.innerHTML = `<header class="header"><div><div class="eyebrow">McKain Research Group · For Michael</div><h1>Lab Finances</h1></div>
      <div class="who">${esc(profile.name || profile.email || '')}<a href="https://mckainlab.org/InventoryManagement/" style="color:#9fe6cf">Lab Orders</a><button class="sm" onclick="signOut()">Sign out</button></div></header>
    <nav class="tabs">${TABS.map(([k, l]) => `<button class="${tab === k ? 'active' : ''}" onclick="go('${k}')">${l}</button>`).join('')}</nav>
    <main id="main"></main>`;
  ({ overview: renderOverview, money: renderMoney, plan: renderPlan, roi: renderRoi, accounts: renderAccounts })[tab]();
}
function go(t) { tab = t; render(); }
const fyOptions = (sel, withAll) => {
  const L = ledger(), years = new Set([fyOf(today()), fyOf(today()) + 1, ...L.map(r => fyOf(r.date)), ...D.budget.map(b => b.fiscal_year)]);
  return (withAll ? `<option value="all"${sel === 'all' ? ' selected' : ''}>All years</option>` : '') +
    [...years].sort((a, b) => b - a).map(y => `<option value="${y}"${+sel === y ? ' selected' : ''}>${fyLabel(y)}</option>`).join('');
};
const acctOptions = (sel, blank = 'All accounts') => `<option value="">${blank}</option>` + D.accounts.map(a => `<option value="${a.id}"${+sel === a.id ? ' selected' : ''}>${esc(a.name)}${a.active ? '' : ' (inactive)'}</option>`).join('');

// ── Overview ────────────────────────────────────────────────
function renderOverview() {
  const m = document.getElementById('main'), L = ledger(), fy = typeof F.fy === 'number' ? F.fy : fyOf(today());
  const [s, e] = fyRange(fy), inFy = L.filter(r => r.date >= s && r.date <= e);
  const spent = inFy.filter(r => r.dir === 'expense').reduce((t, r) => t + r.amount, 0);
  const committed = inFy.filter(r => r.src === 'committed').reduce((t, r) => t + r.amount, 0);
  const income = inFy.filter(r => r.dir === 'income').reduce((t, r) => t + r.amount, 0);
  const fyBudget = D.budget.filter(b => b.fiscal_year === fy).reduce((t, b) => t + Number(b.amount), 0);
  const shown = D.accounts.filter(a => a.active || D.details[a.id]);
  const statuses = shown.map(a => ({ a, st: acctStatus(a, L) }));
  const cash = statuses.reduce((t, x) => t + x.st.balance, 0);
  const byCat = {}, byPayee = {};
  inFy.filter(r => r.dir === 'expense').forEach(r => { byCat[r.category] = (byCat[r.category] || 0) + r.amount; const p = r.payee || '(no payee)'; byPayee[p] = (byPayee[p] || 0) + r.amount; });
  const bars = (obj, colorBy) => { const rows = Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, 10), max = Math.max(1, ...rows.map(r => r[1]));
    return rows.length ? `<div class="bars">${rows.map(([k, v]) => `<div class="b"><span class="lab" title="${esc(k)}">${esc(k)}</span><div class="meter"><span style="width:${v / max * 100}%;${colorBy ? `background:${CAT_COLORS[k] || '#007A62'}` : ''}"></span></div><span class="v">${money(v)}</span></div>`).join('')}</div>`
      : '<div class="empty">No spending in this fiscal year yet.</div>'; };
  m.innerHTML = `
    <div class="filters"><select onchange="F.fy=+this.value;render()">${fyOptions(fy)}</select>
      <span class="hint">The university fiscal year runs October 1 to September 30. Lab Orders orders count automatically; amounts still waiting on a real cost use the order's estimate.</span></div>
    <div class="tiles">

function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',' || c === '\t') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(Boolean));
}
function parseDate(s) {
  s = (s || '').trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})/))) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`; }
  const d = new Date(s); return isNaN(d) ? null : d.toISOString().slice(0, 10);
}
function parseAmount(s) {
  s = String(s || '').trim(); if (!s) return null;
  const neg = /^\(.*\)$/.test(s) || /^-/.test(s) || /-$/.test(s);
  const n = Number(s.replace(/[()$,\s-]/g, ''));
  return isNaN(n) ? null : neg ? -n : n;
}
function guessCategory(text) {
  const t = text.toLowerCase();
  if (/salar|payroll|wage|stipend|fringe|tuition|benefit|student pay|grad asst|postdoc/.test(t)) return 'Personnel';
  if (/travel|airfare|airline|hotel|lodging|mileage|per diem|meal|rental car|registration fee|conference/.test(t)) return 'Travel';
  if (/sequenc|genomic|novogene|psomagen|admera|azenta|genewiz|hudsonalpha|core facility|service center|recharge|illumina service|library prep service/.test(t)) return 'Sequencing & services';
  if (/equipment|capital|freezer|centrifuge|repair|maintenance|service contract/.test(t)) return 'Equipment';
  if (/indirect|f&a|overhead|facilities and admin/.test(t)) return 'Indirect costs';
  return 'Supplies';
}

        total_award: numOrNull(val(bg, 'a-tot')), opening_balance: ob, opening_date: val(bg, 'a-od') || null, notes: val(bg, 'a-notes') || null }, { onConflict: 'account_id' }));
      await loadAll(); render(); toast('Saved');
    });
}

init();
